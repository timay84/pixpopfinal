<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>PixPop overlay</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;pointer-events:none}#stage{position:relative;width:100vw;height:100vh;overflow:hidden}.toy{position:absolute;right:7vw;bottom:5vh;width:180px;height:260px;display:grid;place-items:center;filter:drop-shadow(0 18px 12px #0008);transition:opacity .25s}.toy img{max-width:100%;max-height:100%}.toy-art{width:125px;height:205px;position:relative}.ghost-aura{position:absolute;inset:12px;border-radius:50%;background:#70e8ff55;filter:blur(22px);animation:float 2.6s ease-in-out infinite}.knife,.squeeze{position:absolute;inset:15px;background:linear-gradient(110deg,#ee6b4d,#ffb45e 44%,#c73848 46%,#7c2048);clip-path:polygon(50% 0,100% 26%,70% 61%,83% 100%,17% 100%,30% 61%,0 26%);transform:rotate(20deg)}.squeeze{inset:20px 5px;border-radius:44% 47% 38% 43%;clip-path:none;transform:rotate(-7deg);background:linear-gradient(135deg,#78f0dd,#4db7ec 45%,#7658d9);box-shadow:inset -14px -8px 22px #43309a88}.squeeze:before,.squeeze:after{content:"";position:absolute;background:#11183a;border-radius:50%;width:14px;height:22px;top:58px}.squeeze:before{left:28px}.squeeze:after{right:28px}.particle,.crack,.flash{position:absolute;pointer-events:none}.particle{width:13px;height:13px;border-radius:50%;background:#ffd166;animation:fly 900ms cubic-bezier(.2,.8,.3,1) forwards}.flash{inset:30% 35%;border-radius:50%;background:#fff;animation:flash 260ms ease-out forwards}.crack{left:0;top:45%;width:100vw;height:9px;background:#19182c;box-shadow:0 0 0 2px #e3c9ff,0 0 22px #c36cff;transform:rotate(-8deg);animation:crack 800ms ease-out forwards}.hidden{opacity:0}.shake{animation:shake 380ms ease-in-out}.slash{animation:slash 520ms cubic-bezier(.2,.8,.3,1)}.pop{animation:pop 650ms cubic-bezier(.2,1.6,.4,1)}@keyframes float{50%{transform:translateY(-15px) rotate(3deg)}}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(300deg);opacity:0}}@keyframes flash{to{transform:scale(11);opacity:0}}@keyframes crack{to{transform:translateX(100vw) rotate(-8deg);opacity:0}}@keyframes shake{25%{transform:translate(12px,-5px) rotate(4deg)}50%{transform:translate(-12px,5px) rotate(-4deg)}75%{transform:translate(8px)}to{transform:none}}@keyframes slash{50%{transform:translate(-170px,-80px) rotate(-55deg) scale(1.5)}to{transform:none}}@keyframes pop{45%{transform:scale(1.55) rotate(12deg)}to{transform:none}}
</style></head><body><main id="stage"><div id="toy" class="toy"></div></main><script src="overlay.js"></script></body></html>
