<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>PixPop overlay</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;pointer-events:none}#stage{position:relative;width:100vw;height:100vh;overflow:hidden;pointer-events:none}.toy{position:absolute;right:7vw;bottom:5vh;width:180px;height:260px;display:grid;place-items:center;filter:drop-shadow(0 18px 12px #0008);transition:opacity .25s;transform:translate(calc(var(--move-x,0px) + var(--look-x,0px)),calc(var(--move-y,0px) + var(--look-y,0px)));pointer-events:auto;cursor:pointer}.toy.dragging{cursor:grabbing}.toy img{max-width:100%;max-height:100%}.toy-art{width:145px;height:225px;position:relative;display:grid;place-items:center}.toy-sprite{width:145px;height:225px;object-fit:contain}.ghost-aura{position:absolute;inset:12px;border-radius:50%;background:#70e8ff55;filter:blur(22px);animation:float 2.6s ease-in-out infinite}.particle,.crack,.flash{position:absolute;pointer-events:none}.particle{width:13px;height:13px;border-radius:50%;background:#ffd166;animation:fly 900ms cubic-bezier(.2,.8,.3,1) forwards}.flash{inset:30% 35%;border-radius:50%;background:#fff;animation:flash 260ms ease-out forwards}.crack{left:0;top:45%;width:100vw;height:9px;background:#19182c;box-shadow:0 0 0 2px #e3c9ff,0 0 22px #c36cff;transform:rotate(-8deg);animation:crack 800ms ease-out forwards}.hidden{opacity:0;pointer-events:none}.shake{animation:shake 380ms ease-in-out}.slash{animation:slash 520ms cubic-bezier(.2,.8,.3,1)}.pop{animation:pop 650ms cubic-bezier(.2,1.6,.4,1)}.squish{animation:squish 600ms cubic-bezier(.2,1.4,.4,1)}.spin-crazy{animation:spin-crazy 2s cubic-bezier(.2,.8,.3,1)}.body-stretch-left{animation:body-stretch-left 520ms cubic-bezier(.2,.8,.3,1)}.body-stretch-right{animation:body-stretch-right 520ms cubic-bezier(.2,.8,.3,1)}@keyframes float{50%{transform:translateY(-15px) rotate(3deg)}}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(300deg);opacity:0}}@keyframes flash{to{transform:scale(11);opacity:0}}@keyframes crack{to{transform:translateX(100vw) rotate(-8deg);opacity:0}}@keyframes shake{25%{transform:translate(12px,-5px) rotate(4deg)}50%{transform:translate(-12px,5px) rotate(-4deg)}75%{transform:translate(8px)}to{transform:none}}@keyframes slash{50%{transform:translate(-170px,-80px) rotate(-55deg) scale(1.5)}to{transform:none}}@keyframes pop{45%{transform:scale(1.55) rotate(12deg)}to{transform:none}}@keyframes squish{25%{transform:scale(1.3,.55) translateY(42px)}55%{transform:scale(1.18,.7) translateY(25px)}to{transform:none}}@keyframes spin-crazy{0%{transform:rotate(0) scale(1)}20%{transform:rotate(360deg) scale(1.25)}50%{transform:rotate(720deg) scale(.8)}80%{transform:rotate(1080deg) scale(1.18)}100%{transform:rotate(1080deg) scale(1)}}@keyframes body-stretch-left{25%{transform:translateX(-18px) scaleX(1.6)}60%{transform:translateX(-10px) scaleX(1.3)}to{transform:none}}@keyframes body-stretch-right{25%{transform:translateX(18px) scaleX(1.6)}60%{transform:translateX(10px) scaleX(1.3)}to{transform:none}}
</style><style>
.toy.gentle-mode .toy-art{transform:translateX(var(--gentle-lean,0px)) scaleX(var(--gentle-scale,1))}.gentle-jelly{animation:gentle-jelly 700ms ease-in-out}.gentle-press{animation:gentle-press 900ms ease-in-out infinite}.gentle-swirl{animation:gentle-swirl 1800ms cubic-bezier(.2,.8,.3,1)}.gentle-snap{animation:gentle-snap 600ms cubic-bezier(.1,1.8,.3,1)}.gentle-click{animation:gentle-click 420ms cubic-bezier(.2,1.5,.4,1)}.gentle-melt{animation:gentle-melt 2200ms ease-in-out}.gentle-jelly,.gentle-press,.gentle-swirl,.gentle-snap,.gentle-click,.gentle-melt{transform-origin:center bottom}@keyframes gentle-jelly{0%,100%{transform:translateX(0) scaleX(1) scaleY(1)}20%{transform:translateX(-18px) scaleX(1.2) scaleY(.85) rotate(-5deg)}40%{transform:translateX(20px) scaleX(1.25) scaleY(.8) rotate(6deg)}60%{transform:translateX(-14px) scaleX(1.18) scaleY(.9) rotate(-4deg)}80%{transform:translateX(10px) scaleX(1.1) scaleY(.95) rotate(3deg)}}@keyframes gentle-press{0%,100%{transform:scaleX(1.05) scaleY(.85)}50%{transform:scaleX(1.35) scaleY(.38) translateY(58px)}}@keyframes gentle-swirl{0%{transform:rotate(0) scale(1)}45%{transform:rotate(540deg) scaleX(.65) scaleY(1.35)}100%{transform:rotate(1080deg) scale(1)}}@keyframes gentle-snap{0%{transform:translateX(var(--gentle-lean,0px)) scaleX(var(--gentle-scale,1))}35%{transform:scaleX(.72) scaleY(1.18)}62%{transform:scaleX(1.18) scaleY(.88)}100%{transform:scale(1)}}@keyframes gentle-click{0%{transform:scale(1)}35%{transform:scale(.72,.72)}70%{transform:scale(1.22)}100%{transform:scale(1)}}@keyframes gentle-melt{0%,100%{transform:scale(1)}35%{transform:scaleX(1.28) scaleY(.72) translateY(20px);filter:blur(1px)}70%{transform:scaleX(.86) scaleY(1.12) translateY(8px);filter:blur(2px)}}
</style></head><body><main id="stage"><video id="camera" autoplay muted playsinline></video><div id="toy" class="toy"></div></main><script src="overlay.js"></script></body></html>
